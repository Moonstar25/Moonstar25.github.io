<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hover Gallery</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <h2>Japanese Icons</h2>
        <div id="hover-gallery">
            <div id="mario" class="card">
                <div class="card-front"></div>
                <div class="card-content">
                    <h2>Mario</h2>
                    <p>Let's A Go!</p>
                </div>
            </div>

            <div id="sonic" class="card">
                <div class="card-content">
                    <h2>Sonic</h2>
                    <p>Sonic's The Name, Speeds My Game!</p>
                </div>
            </div>

            <div id="sailor-moon" class="card">
                <div class="card-content">
                    <h2>Sailor Moon</h2>
                    <p>In The Name Of The Moon, I'll Punish You!</p>
                </div>
            </div>

            <div id="godzilla" class="card">
                <div class="card-content">
                    <h2>Godzilla</h2>
                    <p>"SKREEEONK!</p>
                </div>
            </div>
        </div>
    </body>
</html>
