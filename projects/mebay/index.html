<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>mebay</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <!-- flexbox container -->
        <div id="three-columns">

            <!-- flexbox item -->
            <div id="thumbnails">
                <div class="thumbnail-container">
                    <img 
                        class="thumbnails" 
                        src="images/Godzilla 2019 main.jpg"
                        alt="king"
                    >
                </div>

                <!-- flexbox-items -->
                <div class="thumbnails">
                    <img 
                        class="image-1" 
                        src="images/Godzilla 2019.jpg" 
                        alt="Goji 1"
                    >
                </div>

                <div class="thumbnails">
                    <img 
                        class="image-2" 
                        src="images/Godzilla 2019 2.jpg" 
                        alt="Goji 2"
                    >
                </div>

                <div class="thumbnails">
                    <img 
                        class="image-3" 
                        src="images/Godzilla 2019 3.jpg" 
                        alt="Goji 3"
                    >
                </div>

                <div class="thumbnails">
                    <img 
                        class="image-4" 
                        src="images/Godzilla 2019 4.jpg" 
                        alt="Goji 4"
                    >
                </div>

                <div class="thumbnails">
                    <img 
                        class="image-5" 
                        src="images/Godzilla 2019 5.jpg" 
                        alt="Goji 5"
                    >
                </div>
            </div>
            
            <!-- flexbox item -->
            <div id="header">
                <h1>
                    <a href="#">
                        <span id="me">me</span><span id="bay">bay</span>
                    </a>
                </h1>
            </div>
            <!-- flexbox item -->
            <div id="main">
                <div class="mebay-item">
                </div>

            </div>
        </div>
    </body>
</html>
