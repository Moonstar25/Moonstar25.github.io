<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>mebay</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>

        <!-- gird item -->
        <div id="header">
            <h1>
                <span class="m">m</span>
                <span class="e">e</span>
                <span class="b">b</span>
                <span class="a">a</span>
                <span class="y">y</span>
            </h1>
        </div>

        <!-- grid container -->
        <div id="three-columns">

            <!-- grid item -->
            <div id="thumbnails">
                <div class="thumbnail-container">
                    <img 
                        class="thumbnails" 
                        src="images/Godzilla 2019 main.jpg"
                        alt="king"
                    >
                </div>

                <!-- grid-items -->
                <div class="thumbnails">
                    <img 
                        class="image-1" 
                        src="images/Godzilla 2019.jpg" 
                        alt="Goji 1"
                    >
                </div>

                <div class="thumbnails">
                    <img 
                        class="image-2" 
                        src="images/Godzilla 2019 2.jpg" 
                        alt="Goji 2"
                    >
                </div>

                <div class="thumbnails">
                    <img 
                        class="image-3" 
                        src="images/Godzilla 2019 3.jpg" 
                        alt="Goji 3"
                    >
                </div>

                <div class="thumbnails">
                    <img 
                        class="image-4" 
                        src="images/Godzilla 2019 4.jpg" 
                        alt="Goji 4"
                    >
                </div>

                <div class="thumbnails">
                    <img 
                        class="image-5" 
                        src="images/Godzilla 2019 5.jpg" 
                        alt="Goji 5"
                    >
                </div>
            </div>
            
            <!-- grid item -->
            <div id="main">
                <div class="mebay-item">
                    <img 
                        class="thumbnails" 
                        src="images/Godzilla 2019 main.jpg"
                        alt="king"
                    >
                </div>

            </div>

            <div id="product-info">
                <h1>
                    Bandai Legendary Godzilla 2019 Normal Ver. 6" 
                    Movie Monster Series Figure *USA*
                </h1>

            </div>
        </div>
    </body>
</html>
